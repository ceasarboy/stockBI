<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - MacroQuant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0a0a0f;
        }
        .bg-bloomberg-bg { background-color: #0a0a0f; }
        .bg-bloomberg-surface { background-color: #1a1a2e; }
        .bg-bloomberg-card { background-color: #16213e; }
        .bg-bloomberg-primary { background-color: #2563eb; }
        .text-bloomberg-text { color: #e0e0e0; }
        .text-bloomberg-muted { color: #888; }
        .text-bloomberg-danger { color: #ef4444; }
        .border-bloomberg-border { border-color: #2a2a3e; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-bloomberg-bg">
    <div class="w-full max-w-md">
        <div class="bg-bloomberg-surface border border-bloomberg-border rounded-lg shadow-lg">
            <div class="px-8 py-6 border-b border-bloomberg-border">
                <h1 class="text-2xl font-bold text-bloomberg-text text-center">MacroQuant</h1>
                <p class="text-bloomberg-muted text-center mt-1">量化交易系统</p>
            </div>
            
            <form id="login-form" class="px-8 py-6 space-y-6">
                <div id="error-message" class="hidden bg-red-900 border border-red-700 text-red-200 px-4 py-3 rounded">
                </div>
                
                <div>
                    <label class="block text-sm text-bloomberg-muted mb-2">用户名</label>
                    <input type="text" id="username" name="username" required
                           class="w-full px-4 py-3 bg-bloomberg-card border border-bloomberg-border rounded text-bloomberg-text focus:outline-none focus:border-bloomberg-primary"
                           placeholder="请输入用户名">
                </div>
                
                <div>
                    <label class="block text-sm text-bloomberg-muted mb-2">密码</label>
                    <input type="password" id="password" name="password" required
                           class="w-full px-4 py-3 bg-bloomberg-card border border-bloomberg-border rounded text-bloomberg-text focus:outline-none focus:border-bloomberg-primary"
                           placeholder="请输入密码">
                </div>
                
                <div class="flex items-center justify-between">
                    <label class="flex items-center">
                        <input type="checkbox" id="remember" class="w-4 h-4 bg-bloomberg-card border-bloomberg-border rounded">
                        <span class="ml-2 text-sm text-bloomberg-muted">记住我</span>
                    </label>
                </div>
                
                <button type="submit" id="login-btn"
                        class="w-full px-4 py-3 bg-bloomberg-primary text-white rounded font-medium hover:bg-blue-600 transition-colors">
                    登录
                </button>
            </form>
            
            <div class="px-8 py-4 border-t border-bloomberg-border text-center">
                <p class="text-sm text-bloomberg-muted">
                    默认管理员: admin / admin123
                </p>
            </div>
        </div>
    </div>
    
    <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('error-message');
        const loginBtn = document.getElementById('login-btn');
        
        loginBtn.disabled = true;
        loginBtn.textContent = '登录中...';
        errorDiv.classList.add('hidden');
        
        try {
            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);
            
            const response = await fetch('/api/v1/auth/login', {
                method: 'POST',
                body: formData
            });
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.detail || '登录失败');
            }
            
            const data = await response.json();
            
            localStorage.setItem('access_token', data.access_token);
            localStorage.setItem('token_type', data.token_type);
            localStorage.setItem('user_role', data.role);
            localStorage.setItem('username', username);
            
            window.location.href = '/ui/';
        } catch (error) {
            errorDiv.textContent = error.message;
            errorDiv.classList.remove('hidden');
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = '登录';
        }
    });
    </script>
</body>
</html>
