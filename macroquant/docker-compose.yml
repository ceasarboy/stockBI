version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: macroquant-postgres
    environment:
      POSTGRES_USER: macroquant
      POSTGRES_PASSWORD: macroquant123
      POSTGRES_DB: macroquant
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macroquant"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: macroquant-redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
